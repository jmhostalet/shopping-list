name: Deploy Shopping List

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify and assemble the static site
        run: |
          node --check app.mjs
          node --check sharing.mjs
          node --check quantities.mjs
          node --check catalog.mjs
          node --check firebase-config.mjs
          mkdir _site
          cp index.html favicon.svg styles.css app.mjs catalog.mjs firebase-config.mjs sharing.mjs quantities.mjs _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..8}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq .total_count) && [[ "$count" -gt 0 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "The Pages artifact did not become available."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
